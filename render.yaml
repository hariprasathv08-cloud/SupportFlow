services:
  # 1. Backend Web Service (FastAPI)
  - type: web
    name: supportflow-backend
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    plan: free
    envVars:
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        fromDatabase:
          name: supportflow-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

  # 2. Frontend Web Service (React/Vite served via Nginx)
  - type: web
    name: supportflow-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      - key: PORT
        value: 80
      - key: VITE_API_URL
        value: "" # Set this to your backend service's public URL + "/api/v1" after the backend is created (e.g. https://supportflow-backend.onrender.com/api/v1)

databases:
  - name: supportflow-db
    plan: free

