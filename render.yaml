services:
  # 1. Backend Web Service (FastAPI)
  - type: web
    name: helpdeskx-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        value: "" # Empty forces fallback to SQLite, or they can link a Render PostgreSQL database here

  # 2. Frontend Web Service (React/Vite served via Nginx)
  - type: web
    name: helpdeskx-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      - key: PORT
        value: 80
      - key: VITE_API_URL
        value: "" # Set this to the backend's URL + "/api/v1" once the backend is deployed
